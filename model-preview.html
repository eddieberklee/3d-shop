<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3d-shop model preview</title>
    <style>
      body { margin: 0; font: 300 14px "Helvetica Neue", system-ui, sans-serif; color: #2b2925; background: #efe8db; }
      main { display: grid; grid-template-columns: 1fr 2fr; height: 100vh; }
      img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
      section { position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: absolute; margin: 0; top: 10px; left: 12px; right: 12px; letter-spacing: 0.08em; }
      nav { position: absolute; bottom: 10px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; }
    </style>
  </head>
  <body>
    <!-- A developer page: the green-screen image beside the Neon model (left) and the Argon model (right). -->
    <main>
      <img id="cutout" alt="Green-screen product image" />
      <section>
        <canvas id="stage"></canvas>
        <p id="label"></p>
        <nav id="list"></nav>
      </section>
    </main>
    <script type="module" src="/src/dev/modelPreview.ts"></script>
  </body>
</html>
